version: '3.8'

services:
  neo4j:
    image: neo4j:5.20.0-community
    container_name: missing_person_neo4j
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/investigation2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  mock_platform:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: missing_person_mock_platform
    ports:
      - "5005:5005"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  neo4j_data:
  neo4j_logs:
