red_herrings:
  - id: "RH-01"
    name: "Ex-Partner Vengeance Suspicion"
    description: >
      Lucas Reed posted aggressive public comments demanding Maya return equipment and was tracked
      checking in near SFO Airport. Analysis must resolve that Lucas flew to Seattle on flight SEA-441
      with documented timestamps and boarding receipts, eliminating him as a physical abductor.
  - id: "RH-02"
    name: "Parody / Impersonation Travel Account"
    description: >
      An unverified account @mayalin_travels posted beach photos claiming Maya ran away to Cabo.
      EXIF extraction and perceptual hashing (pHash) reveal the images were taken 2 years prior
      with mismatched camera signatures (iPhone 8 instead of Sony a7 IV) and scraped stock images.
  - id: "RH-03"
    name: "Abandoned Vehicle False Alarm"
    description: >
      A report of an abandoned sedan at Silver Sands Motel / Coastal Vista caused search units
      to deploy. Vehicle registration queries link the car to student Marcus Cole, who ran out of gas.
